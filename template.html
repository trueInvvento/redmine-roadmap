<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROADMAP</title>
  <style>
    .timeline {
      position: relative;
      list-style-type: none;
      padding: 0;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 50px;
    }

    .timeline-mvp {
      position: relative;
      width: 150px;
      height: 150px;
      background-color: #FF9F55;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      z-index: 1;
      top: -40px;
      border: 5px solid white;
      font-size: 34px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20px;
      width: 2px;
      height: 100%;
      background-color: #000;
    }

    .timeline-content {
      padding-left: 40px;
    }

    .timeline-date {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .timeline-description {
      margin-bottom: 20px;
    }
  </style>
  <style type="text/css">
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #008000;
      font-family: Helvetica, sans-serif;
    }

    .timeline {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
    }

    .timeline::after {
      content: '';
      position: absolute;
      width: 6px;
      background-color: #ffdab9;
      top: 0;
      bottom: 0;
      left: 50%;
      margin-left: -4px;
    }

    .container {
      padding: 10px 40px;
      position: relative;
      background-color: inherit;
      width: 50%;
    }

    .container::after {
      content: '';
      position: absolute;
      width: 25px;
      height: 25px;
      right: -17px;
      background-color: white;
      border: 4px solid #FF9F55;
      top: 15px;
      border-radius: 50%;
      z-index: 1;
    }

    .left {
      left: 0;
    }

    .right {
      left: 50%;
    }

    .left::before {
      content: " ";
      height: 0;
      position: absolute;
      top: 22px;
      width: 0;
      z-index: 1;
      right: 30px;
      border: medium solid white;
      border-width: 10px 0 10px 10px;
      border-color: transparent transparent transparent white;
    }

    .right::before {
      content: " ";
      height: 0;
      position: absolute;
      top: 22px;
      width: 0;
      z-index: 1;
      left: 30px;
      border: medium solid white;
      border-width: 10px 10px 10px 0;
      border-color: transparent white transparent transparent;
    }

    .right::after {
      left: -16px;
    }

    .content {
      padding: 10px 10px;
      background-color: white;
      position: relative;
      border-radius: 6px;
    }

    @media screen and (max-width: 600px) {
      .timeline::after {
        left: 31px;
      }

      .container {
        width: 100%;
        padding-left: 70px;
        padding-right: 25px;
      }

      .container::before {
        left: 60px;
        border: medium solid white;
        border-width: 10px 10px 10px 0;
        border-color: transparent white transparent transparent;
      }

      .left::after, .right::after {
        left: 15px;
      }

      .right {
        left: 0%;
      }
    }
  </style>
</head>
<body>

<div class="content" style="text-align:center">
  <h1>{{TITLE}}</h1>
</div>

<div class="timeline">
{{TIMELINE}}
</div>

</body>
</html>
